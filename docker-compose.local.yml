# Docker Compose file for local development
# This runs only PostgreSQL, allowing you to run the backend locally
# while using PostgreSQL in Docker
#
# Usage:
#   docker-compose -f docker-compose.local.yml up -d
#
# Then run the backend locally with:
#   cd backend
#   uvicorn main:app --reload --port 8000

version: "3.9"

services:
  db:
    image: postgres:15-alpine
    container_name: dermatack-db-local
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: dermatack
    volumes:
      - db-data-local:/var/lib/postgresql/data
    ports:
      - "5432:5432"  # Expose PostgreSQL on localhost:5432
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  db-data-local:
